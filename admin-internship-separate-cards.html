<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Separate Cards - Light & Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.5s ease; }
        .glass-dark { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05); }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .pulse-dot { animation: pulse-dot 2s infinite; }
    </style>
</head>
<body x-data="{ darkMode: true }" :class="darkMode ? 'bg-slate-950 text-white font-jakarta' : 'bg-slate-50 text-slate-900 font-jakarta'">

    <!-- THEME TOGGLE -->
    <div class="fixed top-10 right-10 z-50">
        <button @click="darkMode = !darkMode" class="p-4 rounded-3xl border transition-all" :class="darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-700 shadow-xl'">
            <span x-show="darkMode">🌙 DARK MODE</span>
            <span x-show="!darkMode">☀️ LIGHT MODE</span>
        </button>
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center p-6 space-y-6">
        
        <!-- CARD 1: PENDING -->
        <div class="w-full max-w-sm rounded-[2.5rem] p-8 transition-all duration-700 hover:scale-[1.02]" 
             :class="darkMode ? 'glass-dark shadow-2xl shadow-amber-500/5' : 'glass-light shadow-2xl shadow-slate-200'">
            <div class="flex items-start justify-between mb-6">
                <div class="p-4 rounded-3xl bg-amber-500/10 border border-amber-500/20">
                    <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 01-9-3.876m5.94-2.285A6.707 6.707 0 0121 8.252"></path></svg>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-3 py-1 bg-amber-500/10 text-amber-600 text-[10px] font-black rounded-lg border border-amber-500/10 uppercase tracking-widest">10 Waiting</span>
                    <div class="w-2 h-2 rounded-full bg-amber-500 pulse-dot"></div>
                </div>
            </div>
            <div class="space-y-1">
                <h3 class="font-black text-xl uppercase tracking-tight" :class="darkMode ? 'text-white' : 'text-slate-900'">Pending Applications</h3>
                <p class="text-sm font-bold opacity-60" :class="darkMode ? 'text-slate-400' : 'text-slate-500'">Authorized personnel review requested for new nodes.</p>
            </div>
            <button class="mt-8 w-full py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] transition-all" 
                    :class="darkMode ? 'bg-amber-500 text-white hover:bg-amber-600 shadow-lg shadow-amber-500/20' : 'bg-amber-500 text-white hover:bg-amber-600 shadow-xl'">
                Execute Authorization
            </button>
        </div>

        <!-- CARD 2: FINISHED -->
        <div class="w-full max-w-sm rounded-[2.5rem] p-8 transition-all duration-700 hover:scale-[1.02]" 
             :class="darkMode ? 'glass-dark shadow-2xl shadow-blue-500/5' : 'glass-light shadow-2xl shadow-slate-200'">
            <div class="flex items-start justify-between mb-6">
                <div class="p-4 rounded-3xl bg-blue-500/10 border border-blue-500/20">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z"></path></svg>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-3 py-1 bg-blue-500/10 text-blue-600 text-[10px] font-black rounded-lg border border-blue-500/10 uppercase tracking-widest">5 Ended</span>
                    <div class="w-2 h-2 rounded-full bg-blue-500 pulse-dot"></div>
                </div>
            </div>
            <div class="space-y-1">
                <h3 class="font-black text-xl uppercase tracking-tight" :class="darkMode ? 'text-white' : 'text-slate-900'">Finished Internships</h3>
                <p class="text-sm font-bold opacity-60" :class="darkMode ? 'text-slate-400' : 'text-slate-500'">Final archival and certificate processing required.</p>
            </div>
            <button class="mt-8 w-full py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] transition-all" 
                    :class="darkMode ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-lg shadow-blue-500/20' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-xl'">
                Link Final Documents
            </button>
        </div>

        <!-- CARD 3: EXTENSIONS -->
        <div class="w-full max-w-sm rounded-[2.5rem] p-8 transition-all duration-700 opacity-60 grayscale hover:grayscale-0 hover:opacity-100" 
             :class="darkMode ? 'glass-dark border-slate-800/20' : 'glass-light border-slate-200/50'">
            <div class="flex items-start justify-between mb-6">
                <div class="p-4 rounded-3xl bg-slate-500/10 border border-slate-500/20">
                    <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="px-3 py-1 bg-slate-500/10 text-slate-500 text-[10px] font-black rounded-lg border border-slate-500/10 uppercase tracking-widest">0 Request</span>
            </div>
            <div class="space-y-1 text-center py-4">
                <h3 class="font-black text-xl uppercase tracking-tight opacity-40">Extensions</h3>
                <p class="text-[10px] font-black uppercase tracking-[0.4em] text-[#ed1e28] animate-pulse mt-2">All Clear</p>
            </div>
        </div>

    </div>

</body>
</html>
