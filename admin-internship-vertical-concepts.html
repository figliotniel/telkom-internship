<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Vertical Alerts - Light & Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.5s ease; }
        .glass-dark { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05); }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .pulse-dot { animation: pulse-dot 2s infinite; }
    </style>
</head>
<body x-data="{ darkMode: true }" :class="darkMode ? 'bg-slate-950 text-white font-jakarta' : 'bg-slate-50 text-slate-900 font-jakarta'">

    <!-- THEME TOGGLE -->
    <div class="fixed top-10 right-10 z-50">
        <button @click="darkMode = !darkMode" class="p-4 rounded-3xl border transition-all" :class="darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-700 shadow-xl'">
            <span x-show="darkMode">🌙 DARK MODE</span>
            <span x-show="!darkMode">☀️ LIGHT MODE</span>
        </button>
    </div>

    <div class="min-h-screen flex items-center justify-center p-6">
        
        <!-- VERTICAL HUD HUB CARD -->
        <div class="w-full max-w-sm rounded-[3rem] p-4 transition-all duration-700" 
             :class="darkMode ? 'glass-dark shadow-2xl shadow-black/50' : 'glass-light shadow-2xl shadow-slate-200'">
            
            <!-- HEADER -->
            <div class="px-8 py-8 flex items-center justify-between border-b" :class="darkMode ? 'border-slate-800/50' : 'border-slate-100'">
                <div class="space-y-1">
                    <h1 class="text-xl font-black uppercase tracking-tight" :class="darkMode ? 'text-white' : 'text-slate-900'">Requires Attention</h1>
                    <p class="text-[10px] font-black uppercase tracking-[0.3em]" :class="darkMode ? 'text-slate-500' : 'text-slate-400'">Monitoring Active Links</p>
                </div>
                <div class="w-3 h-3 rounded-full bg-amber-500 pulse-dot shadow-[0_0_15px_rgba(245,158,11,0.5)]"></div>
            </div>

            <!-- ACTION STACK -->
            <div class="p-3 space-y-4 mt-6">
                
                <!-- NODE 1: PENDING -->
                <div class="p-6 rounded-[2rem] border transition-all hover:-translate-y-1" 
                     :class="darkMode ? 'bg-slate-900/50 border-slate-800/50 hover:border-amber-500/30' : 'bg-white border-slate-100 hover:border-amber-500/20 shadow-sm'">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 rounded-2xl bg-amber-500/10">
                            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 01-9-3.876m5.94-2.285A6.707 6.707 0 0121 8.252"></path></svg>
                        </div>
                        <span class="px-3 py-1 bg-amber-500/10 text-amber-600 text-[10px] font-black rounded-lg border border-amber-500/10 uppercase tracking-widest">10 Waiting</span>
                    </div>
                    <h3 class="font-black text-sm uppercase tracking-tight">Pending Applications</h3>
                    <p class="text-[11px] font-bold mt-1" :class="darkMode ? 'text-slate-500' : 'text-slate-400'">Review new internship authorization requests.</p>
                </div>

                <!-- NODE 2: FINISHED -->
                <div class="p-6 rounded-[2rem] border transition-all hover:-translate-y-1" 
                     :class="darkMode ? 'bg-slate-900/50 border-slate-800/50 hover:border-blue-500/30' : 'bg-white border-slate-100 hover:border-blue-500/20 shadow-sm'">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 rounded-2xl bg-blue-500/10">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z"></path></svg>
                        </div>
                        <span class="px-3 py-1 bg-blue-500/10 text-blue-600 text-[10px] font-black rounded-lg border border-blue-500/10 uppercase tracking-widest">5 Ended</span>
                    </div>
                    <h3 class="font-black text-sm uppercase tracking-tight">Finished Internships</h3>
                    <p class="text-[11px] font-bold mt-1" :class="darkMode ? 'text-slate-500' : 'text-slate-400'">Prepare completion documents and certificates.</p>
                </div>

                <!-- NODE 3: EXTENSIONS -->
                <div class="p-6 rounded-[2rem] border transition-all" 
                     :class="darkMode ? 'bg-slate-950/50 border-slate-800/20 opacity-40' : 'bg-slate-50 border-slate-200/50 opacity-50'">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 rounded-2xl bg-slate-500/10">
                            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="px-3 py-1 bg-slate-500/10 text-slate-500 text-[10px] font-black rounded-lg border border-slate-500/10 uppercase tracking-widest">0 Requests</span>
                    </div>
                    <h3 class="font-black text-sm uppercase tracking-tight">Extension Requests</h3>
                    <p class="text-[11px] font-bold mt-1 uppercase" :class="darkMode ? 'text-slate-500' : 'text-slate-400'">All Clear</p>
                </div>

            </div>

            <!-- FOOTER -->
            <div class="px-8 py-8 mt-4 border-t text-center" :class="darkMode ? 'border-slate-800/50' : 'border-slate-100'">
                 <button class="w-full py-4 rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] transition-all" 
                         :class="darkMode ? 'bg-white text-slate-950 hover:bg-slate-200' : 'bg-slate-900 text-white hover:bg-slate-800'">
                    Link System Dashboard
                 </button>
            </div>

        </div>

    </div>

</body>
</html>
