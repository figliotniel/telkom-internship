<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Mentor Management Modal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Input styling */
        .input-field {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-field:focus-within {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center relative overflow-hidden bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center">
    
    <!-- Dark overlay background to simulate modal background -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-0"></div>

    <!-- Toggle Dark Mode Button (For Demo Purposes) -->
    <button onclick="document.documentElement.classList.toggle('dark')" class="absolute top-6 right-6 z-50 px-4 py-2 bg-white dark:bg-slate-800 rounded-full shadow-lg font-bold text-sm text-slate-800 dark:text-white border border-slate-200 dark:border-slate-700 hover:scale-105 transition-transform">
        Toggle Dark Mode
    </button>

    <!-- Modal Container -->
    <div class="glass-panel w-full max-w-6xl rounded-[2rem] shadow-2xl z-10 mx-4 flex flex-col md:flex-row overflow-hidden max-h-[90vh] border-0 ring-1 ring-white/20 dark:ring-white/10 animate-[fadeIn_0.4s_ease-out]">
        
        <!-- ========================================== -->
        <!-- LEFT SIDE: List of existing mentors -->
        <!-- ========================================== -->
        <div class="w-full md:w-5/12 lg:w-4/12 flex flex-col bg-white/40 dark:bg-slate-900/40 relative border-b md:border-b-0 md:border-r border-slate-200/50 dark:border-slate-700/50">
            
            <!-- Header Left -->
            <div class="px-8 py-6 border-b border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center sticky top-0 backdrop-blur-xl z-20">
                <div>
                    <h3 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Daftar Mentor</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">Pembimbing aktif divisi</p>
                </div>
                <div class="px-3 py-1.5 bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 text-xs font-black rounded-xl border border-brand-100 dark:border-brand-500/20 shadow-sm">
                    4 Mentor
                </div>
            </div>

            <!-- List Area (Scrollable) -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                
                <!-- Mentor Item 1 -->
                <div class="group relative bg-white dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700/50 rounded-2xl p-4 flex items-center gap-4 hover:shadow-xl hover:shadow-brand-500/10 hover:border-brand-300 dark:hover:border-brand-500/50 hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                    <div class="w-12 h-12 rounded-[1rem] bg-gradient-to-br from-brand-500 to-orange-500 flex items-center justify-center text-white font-bold text-lg shadow-inner shrink-0 ring-2 ring-white dark:ring-slate-900">
                        A
                    </div>
                    <div class="min-w-0 flex-1">
                        <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm truncate group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">Ahmad Santoso</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">ahmad@telkom.co.id</p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[9px] px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md font-bold uppercase tracking-wider">Officer 1 Divisi</span>
                        </div>
                    </div>
                </div>

                <!-- Mentor Item 2 -->
                <div class="group relative bg-white dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700/50 rounded-2xl p-4 flex items-center gap-4 hover:shadow-xl hover:shadow-brand-500/10 hover:border-brand-300 dark:hover:border-brand-500/50 hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                    <div class="w-12 h-12 rounded-[1rem] bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center text-white font-bold text-lg shadow-inner shrink-0 ring-2 ring-white dark:ring-slate-900">
                        B
                    </div>
                    <div class="min-w-0 flex-1">
                        <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm truncate group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">Budi Setiawan</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">budi@telkom.co.id</p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[9px] px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md font-bold uppercase tracking-wider">Officer 2 Divisi</span>
                        </div>
                    </div>
                </div>

                <!-- Mentor Item 3 -->
                <div class="group relative bg-white dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700/50 rounded-2xl p-4 flex items-center gap-4 hover:shadow-xl hover:shadow-brand-500/10 hover:border-brand-300 dark:hover:border-brand-500/50 hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                    <div class="w-12 h-12 rounded-[1rem] bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center text-white font-bold text-lg shadow-inner shrink-0 ring-2 ring-white dark:ring-slate-900">
                        C
                    </div>
                    <div class="min-w-0 flex-1">
                        <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm truncate group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">Citra Lestari</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">citra@telkom.co.id</p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[9px] px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md font-bold uppercase tracking-wider">Senior Officer</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: Form Add Mentor -->
        <!-- ========================================== -->
        <div class="w-full md:w-7/12 lg:w-8/12 flex flex-col bg-white dark:bg-slate-900 relative">
            
            <!-- Close Button (Absolute Top Right) -->
            <button class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full p-2.5 transition-all focus:outline-none z-30 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Form Header -->
            <div class="px-10 pt-10 pb-6 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center text-brand-600 dark:text-brand-400 border border-brand-100 dark:border-brand-500/20">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Tambah Mentor Baru</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium">Buat akun untuk pembimbing magang dengan kredensial baru.</p>
                    </div>
                </div>
            </div>
            
            <!-- Form Scrollable Area -->
            <div class="px-10 py-8 overflow-y-auto custom-scrollbar flex-1">
                <form action="#" class="space-y-6">
                    
                    <!-- Form Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- Nama Lengkap (Full Width) -->
                        <div class="input-field md:col-span-2">
                            <label class="block text-[11px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1 mb-2">Nama Lengkap <span class="text-brand-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                </div>
                                <input type="text" placeholder="Masukkan nama lengkap" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="input-field">
                            <label class="block text-[11px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1 mb-2">Email <span class="text-brand-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </div>
                                <input type="email" placeholder="mentor@telkom.co.id" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="input-field">
                            <label class="block text-[11px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1 mb-2">Password Login <span class="text-brand-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <input type="password" placeholder="Minimal 8 karakter" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm">
                            </div>
                        </div>

                        <!-- NIK -->
                        <div class="input-field">
                            <label class="block text-[11px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1 mb-2">Nomor Induk Karyawan <span class="text-brand-500">*</span></label>
                            <input type="text" placeholder="Contoh: 12345678" class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm">
                        </div>

                        <!-- Jabatan -->
                        <div class="input-field">
                            <label class="block text-[11px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest ml-1 mb-2">Jabatan (Posisi) <span class="text-brand-500">*</span></label>
                            <input type="text" placeholder="Contoh: Officer 2" class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm">
                        </div>

                    </div>

                    <!-- Footer Action -->
                    <div class="pt-8 mt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-4">
                        <button type="button" class="px-6 py-3.5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-colors text-sm">
                            Batal
                        </button>
                        <button type="button" class="px-8 py-3.5 bg-brand-600 text-white rounded-2xl hover:bg-brand-700 transition-all font-bold text-sm shadow-[0_4px_14px_0_rgba(220,38,38,0.39)] hover:shadow-[0_6px_20px_rgba(220,38,38,0.23)] active:scale-95 flex items-center gap-2">
                            Simpan Data Mentor
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>

                </form>
            </div>
            
        </div>
    </div>
</body>
</html>
